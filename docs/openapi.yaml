components:
  schemas:
    Acknowledge:
      properties:
        task_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Task Id
      additionalProperties: false
      type: object
      required:
      - task_id
      title: Acknowledge
    Acknowledged:
      properties:
        status:
          type: string
          const: acknowledged
          title: Status
      additionalProperties: false
      type: object
      required:
      - status
      title: Acknowledged
    CaptureInput:
      properties:
        task_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Task Id
        attempt:
          type: integer
          enum:
          - 1
          - 2
          title: Attempt
          description: 2 是確認用的第二張照片
          default: 1
        image:
          anyOf:
          - type: string
            maxLength: 2800100
          - type: 'null'
          title: Image
          description: data:image/jpeg|png|webp;base64,...，最大 2 MB；只交給模型看，不保存。
        reference:
          anyOf:
          - type: string
            maxLength: 2800100
          - type: 'null'
          title: Reference
          description: 變化比對的基準照片（只存在瀏覽器），與 image 一起交給模型比較。
        quality:
          anyOf:
          - $ref: '#/components/schemas/CaptureQuality'
          - type: 'null'
        captured_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Captured At
          description: 拍下的時間；與伺服器差太多時改用伺服器時間
        skip:
          anyOf:
          - type: string
            enum:
            - camera_off
            - camera_unavailable
            - permission_denied
          - type: 'null'
          title: Skip
          description: 沒有照片時的原因；這次執行也會留下紀錄
        trigger:
          anyOf:
          - type: string
            const: watch
          - type: 'null'
          title: Trigger
          description: watch：網頁持續盯著時看到變化並穩定後觸發，不需要確認照片
        moment:
          anyOf:
          - type: string
            maxLength: 2800100
          - type: 'null'
          title: Moment
          description: 變化剛開始時的畫面，讓模型描述當時的動作；不保存。
      additionalProperties: false
      type: object
      required:
      - task_id
      title: CaptureInput
    CaptureOutput:
      properties:
        status:
          type: string
          enum:
          - done
          - confirming
          - queued
          - skipped
          - cancelled
          title: Status
        decision:
          anyOf:
          - type: string
            enum:
            - done
            - confirm
            - notify
            - muted
            - unconfirmed
            - baseline
            - skipped
          - type: 'null'
          title: Decision
        result:
          anyOf:
          - type: string
            enum:
            - 'yes'
            - 'no'
            - unknown
            - seen
            - skipped
          - type: 'null'
          title: Result
        notice:
          anyOf:
          - type: string
            enum:
            - alert
            - repeat
            - recovered
            - changed
            - report
            - unseen
          - type: 'null'
          title: Notice
        level:
          anyOf:
          - type: integer
          - type: 'null'
          title: Level
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        quality_flags:
          items:
            type: string
          type: array
          title: Quality Flags
        observation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Observation Id
        store_reference:
          type: boolean
          title: Store Reference
          description: true：網頁要把這張照片存成新的基準照片
          default: false
        confirm_after_seconds:
          anyOf:
          - type: integer
          - type: 'null'
          title: Confirm After Seconds
          description: 要確認時：第二張照片應在第一張之後幾秒拍
      additionalProperties: false
      type: object
      required:
      - status
      title: CaptureOutput
    CaptureQuality:
      properties:
        brightness:
          anyOf:
          - type: number
            maximum: 255.0
            minimum: 0.0
          - type: 'null'
          title: Brightness
          description: 平均亮度 0-255
        contrast:
          anyOf:
          - type: number
            maximum: 255.0
            minimum: 0.0
          - type: 'null'
          title: Contrast
          description: 亮度標準差
        sharpness:
          anyOf:
          - type: number
            maximum: 1000000.0
            minimum: 0.0
          - type: 'null'
          title: Sharpness
          description: Laplacian 變異數，越小越模糊
        width:
          anyOf:
          - type: integer
            maximum: 10000.0
            minimum: 1.0
          - type: 'null'
          title: Width
        height:
          anyOf:
          - type: integer
            maximum: 10000.0
            minimum: 1.0
          - type: 'null'
          title: Height
      additionalProperties: false
      type: object
      title: CaptureQuality
      description: Measured in the browser on a grey copy of the photo; recorded,
        never used to retake.
    CaptureRequest:
      properties:
        task_id:
          type: string
          title: Task Id
        job_id:
          type: string
          title: Job Id
        attempt:
          type: integer
          enum:
          - 1
          - 2
          title: Attempt
        mode:
          type: string
          enum:
          - check
          - change
          - report
          title: Mode
        question:
          type: string
          title: Question
        roi:
          anyOf:
          - $ref: '#/components/schemas/Roi'
          - type: 'null'
        baseline:
          type: boolean
          title: Baseline
          description: 變化比對還沒有基準：這張照片會成為基準
        expires_at:
          type: string
          format: date-time
          title: Expires At
      additionalProperties: false
      type: object
      required:
      - task_id
      - job_id
      - attempt
      - mode
      - question
      - baseline
      - expires_at
      title: CaptureRequest
    ConversationOutput:
      properties:
        request_id:
          type: string
          title: Request Id
        user_text:
          type: string
          title: User Text
        response:
          $ref: '#/components/schemas/InteractionResponse'
        created_at:
          type: string
          format: date-time
          title: Created At
      additionalProperties: false
      type: object
      required:
      - request_id
      - user_text
      - response
      - created_at
      title: ConversationOutput
    DeviceInteractionRequest:
      properties:
        session_id:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]+$
          title: Session Id
          default: default
        request_id:
          type: string
          format: uuid
          title: Request Id
        user_message:
          type: string
          maxLength: 2000
          minLength: 1
          title: User Message
        personality:
          $ref: '#/components/schemas/PersonalityConfig'
        image:
          anyOf:
          - type: string
            maxLength: 2800100
          - type: 'null'
          title: Image
          description: 使用者上傳的一張圖片，data:image/jpeg|png|webp;base64,...，最大 2 MB；只交給模型看，不保存。
        camera:
          anyOf:
          - type: string
            enum:
            - 'on'
            - 'off'
