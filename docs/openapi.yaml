openapi: 3.1.0
info:
  title: MEMO
  version: 0.1.0
paths:
  /api/v1/devices:
    post:
      tags:
      - devices
      summary: Register Device
      operationId: register_device_api_v1_devices_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceSchema'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - devices
      summary: List Devices
      operationId: list_devices_api_v1_devices_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceSchema'
                title: Response List Devices Api V1 Devices Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/devices/{device_id}:
    get:
      tags:
      - devices
      summary: Get Device
      operationId: get_device_api_v1_devices__device_id__get
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSchema'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/telemetry:
    post:
      tags:
      - telemetry
      summary: Ingest
      operationId: ingest_api_v1_telemetry_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingOutput'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/devices/{device_id}/readings:
    get:
      tags:
      - telemetry
      summary: History
      operationId: history_api_v1_devices__device_id__readings_get
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      - name: start
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Start
      - name: end
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: End
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReadingOutput'
                title: Response History Api V1 Devices  Device Id  Readings Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/llm/personality:
    get:
      tags:
      - MEMO interaction
      summary: 取得 MEMO 預設人格
      operationId: get_personality_api_v1_llm_personality_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalityConfig'
  /api/v1/llm/prepare:
    post:
      tags:
      - MEMO interaction
      summary: 組裝 LLM 輸入與輸出契約（不呼叫模型）
      operationId: prepare_api_v1_llm_prepare_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreparedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/llm/respond:
    post:
      tags:
      - MEMO interaction
      summary: 產生 MEMO 文字與情緒（模型或備援回覆）
      operationId: respond_api_v1_llm_respond_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/devices/{device_id}/interaction:
    post:
      tags:
      - MEMO interaction
      summary: 從後端資料庫取得裝置最新讀值，產生 MEMO 回覆
      operationId: device_interaction_api_v1_devices__device_id__interaction_post
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceInteractionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/devices/{device_id}/memory/conversation:
    get:
      tags:
      - MEMO memory and events
      summary: Conversation
      operationId: conversation_api_v1_devices__device_id__memory_conversation_get
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      - name: session_id
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-zA-Z0-9_-]+$
          default: default
          title: Session Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationOutput'
                title: Response Conversation Api V1 Devices  Device Id  Memory Conversation
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - MEMO memory and events
      summary: Clear Conversation
      operationId: clear_conversation_api_v1_devices__device_id__memory_conversation_delete
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      - name: session_id
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-zA-Z0-9_-]+$
          default: default
          title: Session Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/devices/{device_id}/memory/tasks:
    get:
      tags:
      - MEMO memory and events
      summary: Task Memory
      operationId: task_memory_api_v1_devices__device_id__memory_tasks_get
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 30
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskOutput'
                title: Response Task Memory Api V1 Devices  Device Id  Memory Tasks
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/devices/{device_id}/events:
    get:
      tags:
      - MEMO memory and events
      summary: Events
      operationId: events_api_v1_devices__device_id__events_get
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventOutput'
                title: Response Events Api V1 Devices  Device Id  Events Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/devices/{device_id}/notifications:
    get:
      tags:
      - MEMO memory and events
      summary: Notifications
      operationId: notifications_api_v1_devices__device_id__notifications_get
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskOutput'
                title: Response Notifications Api V1 Devices  Device Id  Notifications
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/devices/{device_id}/notifications/ack:
    post:
      tags:
      - MEMO memory and events
      summary: Acknowledge
      operationId: acknowledge_api_v1_devices__device_id__notifications_ack_post
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Acknowledge'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acknowledged'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/devices/{device_id}/schedules:
    get:
      tags:
      - MEMO schedules
      summary: List Schedules
      operationId: list_schedules_api_v1_devices__device_id__schedules_get
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobOutput'
                title: Response List Schedules Api V1 Devices  Device Id  Schedules
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - MEMO schedules
      summary: Create Schedule
      operationId: create_schedule_api_v1_devices__device_id__schedules_post
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOutput'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/devices/{device_id}/schedules/{job_id}:
    patch:
      tags:
      - MEMO schedules
      summary: Update Schedule
      operationId: update_schedule_api_v1_devices__device_id__schedules__job_id__patch
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOutput'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - MEMO schedules
      summary: Delete Schedule
      operationId: delete_schedule_api_v1_devices__device_id__schedules__job_id__delete
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/devices/{device_id}/digest:
    post:
      tags:
      - MEMO schedules
      summary: Digest
      description: One or two sentences on what the user missed since ``since``; text
        is null if nothing.
      operationId: digest_api_v1_devices__device_id__digest_post
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
          title: Device Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DigestRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigestOutput'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health/live:
    get:
      tags:
      - health
      summary: Live
      operationId: live_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health/ready:
    get:
      tags:
      - health
      summary: Ready
      operationId: ready_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    Acknowledge:
      properties:
        task_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Task Id
      additionalProperties: false
      type: object
      required:
      - task_id
      title: Acknowledge
    Acknowledged:
      properties:
        status:
          type: string
          const: acknowledged
          title: Status
      additionalProperties: false
      type: object
      required:
      - status
      title: Acknowledged
    ConversationOutput:
      properties:
        request_id:
          type: string
          title: Request Id
        user_text:
          type: string
          title: User Text
        response:
          $ref: '#/components/schemas/InteractionResponse'
        created_at:
          type: string
          format: date-time
          title: Created At
      additionalProperties: false
      type: object
      required:
      - request_id
      - user_text
      - response
      - created_at
      title: ConversationOutput
    DeviceInteractionRequest:
      properties:
        session_id:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]+$
          title: Session Id
          default: default
        request_id:
          type: string
          format: uuid
          title: Request Id
        user_message:
          type: string
          maxLength: 2000
          minLength: 1
          title: User Message
        personality:
          $ref: '#/components/schemas/PersonalityConfig'
      additionalProperties: false
      type: object
      required:
      - user_message
      title: DeviceInteractionRequest
    DeviceSchema:
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]+$
          title: Id
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
        location:
          type: string
          maxLength: 200
          title: Location
          default: ''
      additionalProperties: false
      type: object
      required:
      - id
      - name
      title: DeviceSchema
    DigestOutput:
      properties:
        text:
          anyOf:
          - type: string
          - type: 'null'
          title: Text
        emotion:
          anyOf:
          - $ref: '#/components/schemas/EmotionOutput'
          - type: 'null'
        missed:
          type: integer
          title: Missed
        source:
          anyOf:
          - type: string
            enum:
            - template
            - model
          - type: 'null'
          title: Source
      additionalProperties: false
      type: object
      required:
      - text
      - missed
      title: DigestOutput
    DigestRequest:
      properties:
        since:
          type: string
          format: date-time
          title: Since
          description: 使用者上次在場的時間
      additionalProperties: false
      type: object
      required:
      - since
      title: DigestRequest
    EmotionLabel:
      type: string
      enum:
      - neutral
      - friendly
      - concerned
      - happy
      - confused
      title: EmotionLabel
    EmotionOutput:
      properties:
        label:
          $ref: '#/components/schemas/EmotionLabel'
          description: MEMO 的顯示情緒，不代表使用者情緒或事件嚴重程度。
        intensity:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Intensity
          description: 表情強度，0 到 1。
      additionalProperties: false
      type: object
      required:
      - label
      - intensity
      title: EmotionOutput
    EventInput:
      properties:
        event_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Event Id
        event_version:
          type: integer
          minimum: 1.0
          title: Event Version
        status:
          type: string
          enum:
          - pending
          - active
          - recovering
          - resolved
          - unknown
          title: Status
        rule_evidence:
          type: string
          maxLength: 1000
          minLength: 1
          title: Rule Evidence
          description: 呼叫端提供的規則依據，不是 LLM 自行判斷。
      additionalProperties: false
      type: object
      required:
      - event_id
      - event_version
      - status
      - rule_evidence
      title: EventInput
    EventOutput:
      properties:
        rule_id:
          type: string
          title: Rule Id
        status:
          type: string
          enum:
          - normal
          - pending
          - active
          - recovering
          - resolved
          - unknown
          title: Status
        last:
          type: number
          title: Last
        since:
          anyOf:
          - type: number
          - type: 'null'
          title: Since
        live:
          type: boolean
          title: Live
          default: false
        score:
          anyOf:
          - type: number
          - type: 'null'
          title: Score
        event_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Event Id
        version:
          type: integer
          title: Version
          default: 0
        level:
          anyOf:
          - type: string
            enum:
            - caution
            - warning
            - danger
          - type: 'null'
          title: Level
        active_since:
          anyOf:
          - type: number
          - type: 'null'
          title: Active Since
        notified_at:
          anyOf:
          - type: number
          - type: 'null'
          title: Notified At
        notified_level:
          anyOf:
          - type: string
            enum:
            - caution
            - warning
            - danger
          - type: 'null'
          title: Notified Level
        reminders:
          type: integer
          title: Reminders
          default: 0
        snoozed_until:
          type: number
          title: Snoozed Until
          default: 0
      additionalProperties: false
      type: object
      required:
      - rule_id
      - status
      - last
      title: EventOutput
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HistoryMessage:
      properties:
        role:
          type: string
          enum:
          - user
          - assistant
          title: Role
        content:
          type: string
          maxLength: 2000
          minLength: 1
          title: Content
      additionalProperties: false
      type: object
      required:
      - role
      - content
      title: HistoryMessage
    InteractionContext:
      properties:
        device_id:
          anyOf:
          - type: string
            maxLength: 64
            minLength: 1
            pattern: ^[a-zA-Z0-9_-]+$
          - type: 'null'
          title: Device Id
        observation:
          anyOf:
          - $ref: '#/components/schemas/ObservationInput'
          - type: 'null'
        event:
          anyOf:
          - $ref: '#/components/schemas/EventInput'
          - type: 'null'
        approved_suggestions:
          items:
            type: string
            maxLength: 300
            minLength: 1
          type: array
          maxItems: 5
          title: Approved Suggestions
          description: 呼叫端已核准建議；不代表 API 已驗證。
      additionalProperties: false
      type: object
      title: InteractionContext
    InteractionRequest:
      properties:
        request_id:
          type: string
          format: uuid
          title: Request Id
          description: 追蹤識別碼；不提供儲存或去重。
        user_message:
          type: string
          maxLength: 2000
          minLength: 1
          title: User Message
          examples:
          - MEMO，現在環境如何？
        personality:
          $ref: '#/components/schemas/PersonalityConfig'
          description: 僅套用本次請求，不覆寫預設或持久化。
        context:
          $ref: '#/components/schemas/InteractionContext'
        history:
          items:
            $ref: '#/components/schemas/HistoryMessage'
          type: array
          maxItems: 10
          title: History
      additionalProperties: false
      type: object
      required:
      - user_message
      title: InteractionRequest
    InteractionResponse:
      properties:
        text:
          type: string
          maxLength: 2000
          minLength: 1
          title: Text
          description: 顯示給使用者的繁體中文文字。
        emotion:
          $ref: '#/components/schemas/EmotionOutput'
        request_id:
          type: string
          format: uuid
          title: Request Id
        character:
          type: string
          const: MEMO
          title: Character
          default: MEMO
        source:
          type: string
          enum:
          - template
          - model
          title: Source
          default: template
        fallback_reason:
          anyOf:
          - type: string
            enum:
            - model_not_configured
            - model_timeout
            - model_unavailable
            - invalid_model_output
          - type: 'null'
          title: Fallback Reason
          default: model_not_configured
