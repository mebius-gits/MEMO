      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          title: Rule Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleOutput'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - MEMO events, rules and settings
      summary: Update Rule
      description: '更新門檻並遞增版本，API 與 worker 下一筆讀值即生效（不需重啟）。


        未確認的持續時間與趨勢窗口重新計算；進行中的事件保留原本的規則版本。

        停用規則會靜默結束進行中的事件。要還原預設值，把 `defaults` 原樣送回。'
      operationId: update_rule_api_v1_rules__rule_id__put
      parameters:
      - name: rule_id
        in: path
