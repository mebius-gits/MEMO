components:
  schemas:
    Acknowledge:
      properties:
        task_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Task Id
      additionalProperties: false
      type: object
      required:
      - task_id
      title: Acknowledge
    Acknowledged:
      properties:
        status:
          type: string
          const: acknowledged
          title: Status
      additionalProperties: false
      type: object
      required:
      - status
      title: Acknowledged
    ConversationOutput:
      properties:
        request_id:
          type: string
          title: Request Id
        user_text:
          type: string
          title: User Text
        response:
          $ref: '#/components/schemas/InteractionResponse'
        created_at:
          type: string
          format: date-time
          title: Created At
      additionalProperties: false
      type: object
      required:
      - request_id
      - user_text
      - response
      - created_at
      title: ConversationOutput
    DeviceInteractionRequest:
      properties:
        session_id:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]+$
          title: Session Id
          default: default
        request_id:
          type: string
          format: uuid
          title: Request Id
        user_message:
          type: string
          maxLength: 2000
          minLength: 1
          title: User Message
        personality:
          $ref: '#/components/schemas/PersonalityConfig'
        image:
          anyOf:
          - type: string
            maxLength: 2800100
          - type: 'null'
          title: Image
          description: 使用者上傳的一張圖片，data:image/jpeg|png|webp;base64,...，最大 2 MB；只交給模型看，不保存。
      additionalProperties: false
      type: object
      required:
      - user_message
      title: DeviceInteractionRequest
    DeviceSchema:
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]+$
          title: Id
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
        location:
          type: string
          maxLength: 200
          title: Location
          default: ''
      additionalProperties: false
      type: object
      required:
      - id
      - name
      title: DeviceSchema
    DeviceSettings:
      properties:
        personality:
          $ref: '#/components/schemas/PersonalityConfig'
          default:
            name: MEMO
            language: zh-TW
            tone: gentle
            persona: ''
        quiet_hours:
          anyOf:
          - type: string
            pattern: ^$|^([01]?\d|2[0-3]):[0-5]\d\s*-\s*([01]?\d|2[0-3]):[0-5]\d$
          - type: 'null'
          title: Quiet Hours
          description: 勿擾時段 HH:MM-HH:MM（台北時間，可跨午夜）；空字串表示不設，null 沿用伺服器預設
          examples:
          - 23:00-07:00
        max_proactive_per_hour:
          anyOf:
          - type: integer
            maximum: 60.0
            minimum: 1.0
          - type: 'null'
          title: Max Proactive Per Hour
          description: 每小時主動環境提醒上限；null 沿用伺服器預設
      additionalProperties: false
      type: object
      title: DeviceSettings
    DeviceSettingsOutput:
      properties:
        personality:
          $ref: '#/components/schemas/PersonalityConfig'
          default:
            name: MEMO
            language: zh-TW
            tone: gentle
            persona: ''
        quiet_hours:
          anyOf:
          - type: string
            pattern: ^$|^([01]?\d|2[0-3]):[0-5]\d\s*-\s*([01]?\d|2[0-3]):[0-5]\d$
          - type: 'null'
          title: Quiet Hours
          description: 勿擾時段 HH:MM-HH:MM（台北時間，可跨午夜）；空字串表示不設，null 沿用伺服器預設
          examples:
          - 23:00-07:00
        max_proactive_per_hour:
          anyOf:
          - type: integer
            maximum: 60.0
            minimum: 1.0
          - type: 'null'
          title: Max Proactive Per Hour
          description: 每小時主動環境提醒上限；null 沿用伺服器預設
        effective:
          $ref: '#/components/schemas/EffectiveSettings'
          description: 實際生效的值（裝置設定優先，否則用伺服器預設）
      additionalProperties: false
      type: object
      required:
      - effective
      title: DeviceSettingsOutput
    DeviceState:
      properties:
        device_id:
          type: string
          title: Device Id
        checked_at:
          type: string
          format: date-time
          title: Checked At
        online:
          type: boolean
          title: Online
          description: 任一指標在 30 秒內有有效值
        metrics:
          additionalProperties:
            anyOf:
            - $ref: '#/components/schemas/MetricState'
            - type: 'null'
          type: object
          title: Metrics
        feels_like_c:
          anyOf:
          - type: number
          - type: 'null'
          title: Feels Like C
          description: 由新鮮的溫度（與濕度）計算；溫度不新鮮時為 null
      additionalProperties: false
      type: object
      required:
      - device_id
      - checked_at
      - online
      - metrics
      - feels_like_c
      title: DeviceState
    DigestOutput:
      properties:
        text:
          anyOf:
          - type: string
          - type: 'null'
          title: Text
        emotion:
          anyOf:
          - $ref: '#/components/schemas/EmotionOutput'
          - type: 'null'
        missed:
          type: integer
          title: Missed
        source:
          anyOf:
          - type: string
            enum:
            - template
            - model
          - type: 'null'
          title: Source
      additionalProperties: false
      type: object
      required:
      - text
      - missed
      title: DigestOutput
    DigestRequest:
      properties:
        since:
          type: string
          format: date-time
          title: Since
          description: 使用者上次在場的時間
      additionalProperties: false
      type: object
      required:
      - since
      title: DigestRequest
    EffectiveSettings:
      properties:
        timezone:
          type: string
          title: Timezone
        quiet_hours:
          type: string
          title: Quiet Hours
        max_proactive_per_hour:
          type: integer
          title: Max Proactive Per Hour
      additionalProperties: false
      type: object
      required:
      - timezone
      - quiet_hours
      - max_proactive_per_hour
      title: EffectiveSettings
    EmotionLabel:
      type: string
      enum:
      - neutral
      - friendly
      - concerned
      - happy
      - confused
      - surprised
      - proud
      - sleepy
      - alert
      title: EmotionLabel
    EmotionOutput:
      properties:
        label:
          $ref: '#/components/schemas/EmotionLabel'
          description: MEMO 的顯示情緒，不代表使用者情緒或事件嚴重程度。
        intensity:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Intensity
          description: 表情強度，0 到 1。
      additionalProperties: false
      type: object
      required:
      - label
      - intensity
      title: EmotionOutput
    EventDetail:
      properties:
