        event_id:
          type: string
          title: Event Id
        rule_id:
          type: string
          title: Rule Id
        status:
          type: string
          enum:
          - normal
          - pending
          - active
          - recovering
          - resolved
          - unknown
          - superseded
          title: Status
        started_at:
          type: string
          format: date-time
          title: Started At
        ended_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Ended At
        peak_level:
          anyOf:
          - type: string
            enum:
            - caution
            - warning
            - danger
          - type: 'null'
          title: Peak Level
        rule_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rule Version
          description: 事件開始時採用的規則版本
        last_update:
          type: string
          title: Last Update
        updated_at:
          type: string
          format: date-time
          title: Updated At
        update_count:
          type: integer
