        score:
          anyOf:
          - type: number
          - type: 'null'
          title: Score
        event_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Event Id
        version:
          type: integer
          title: Version
          default: 0
        level:
          anyOf:
          - type: string
            enum:
            - caution
            - warning
            - danger
          - type: 'null'
          title: Level
        active_since:
          anyOf:
          - type: number
          - type: 'null'
          title: Active Since
        notified_at:
          anyOf:
          - type: number
          - type: 'null'
          title: Notified At
        notified_level:
          anyOf:
          - type: string
            enum:
            - caution
            - warning
            - danger
          - type: 'null'
          title: Notified Level
        reminders:
          type: integer
          title: Reminders
          default: 0
        snoozed_until:
