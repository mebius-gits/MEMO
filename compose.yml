name: memo

# When MEMO may speak on its own. Shared by the API (chat, scheduler) and the MQTT worker
# (which runs the rules), so both judge alike. Values come from .env or these defaults.
x-attention: &attention
  TIMEZONE: ${TIMEZONE:-Asia/Taipei}
  QUIET_HOURS: ${QUIET_HOURS:-}
  MAX_PROACTIVE_PER_HOUR: ${MAX_PROACTIVE_PER_HOUR:-6}

services:
  api:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *attention
      APP_NAME: MEMO
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173","https://memo-quiet-room.fancyhen36.chatgpt.site"]}
      DATABASE_URL: sqlite:////data/memo.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - memo-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  node-red:
    build: ./node-red
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      broker:
        condition: service_healthy
    environment:
      TZ: Asia/Taipei
      API_URL: http://api:8000
      DEVICE_ID: room01
      MQTT_HOST: broker
      # Web origins allowed to call the /memo/disturbance endpoint.
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173","https://memo-quiet-room.fancyhen36.chatgpt.site"]}
    ports:
      - "127.0.0.1:1880:1880"
    volumes:
      - node-red-data:/data

  broker:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-t", "memo/health", "-m", "ping", "-q", "1"]
      interval: 5s
      timeout: 5s
      retries: 12

  environment-worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "memo.workers.environment"]
    environment:
      <<: *attention
      DATABASE_URL: sqlite:////data/memo.db
      MQTT_HOST: broker
      MQTT_CLIENT_ID: memo-environment-worker
    volumes:
      - memo-data:/data
    depends_on:
      api:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "memo.workers.environment", "--healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  simulator:
    build: .
    profiles: ["demo"]
    restart: unless-stopped
    command: ["python", "-m", "memo.workers.simulator", "--api-url", "http://api:8000"]
    environment:
      MQTT_HOST: broker
    depends_on:
      environment-worker:
        condition: service_healthy

  # Local speech: SenseVoice-Small STT and Kokoro-82M TTS on CPU (models baked into the image).
  speech:
    build: ./speech
    restart: unless-stopped
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173","https://memo-quiet-room.fancyhen36.chatgpt.site"]}
      SPEECH_THREADS: ${SPEECH_THREADS:-2}
      TTS_SPEAKER_ID: ${TTS_SPEAKER_ID:-3}
      TTS_SPEED: ${TTS_SPEED:-1.3}
    ports:
      - "127.0.0.1:8001:8000"

volumes:
  memo-data:
  node-red-data:
  mqtt-data:
