<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="和 MEMO 坐一會，感受你的空間。3D 環境感知小夥伴。" />
    <title>MEMO · 陪你感受每一刻</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <main class="app">
      <section class="stage" data-lamp="day" aria-label="MEMO 3D 陪伴空間">
        <div id="scene" role="img" aria-label="薄荷綠掌機造型的 MEMO 坐著，輕輕呼吸與眨眼"></div>
        <div id="webgl-fallback" hidden><p>這個瀏覽器目前無法顯示 3D。</p><p>請啟用硬體加速，或使用新版 Chrome／Edge。<br>環境資料與對話仍可使用。</p></div>
        <div class="mood" aria-live="polite"><span id="mood-face" aria-hidden="true">◡</span><b id="mood-label">安靜陪伴</b></div>
        <div class="stage-tools"><button id="pause-motion" class="icon-button" aria-label="暫停動態" title="暫停動態"></button><button id="reset-camera" class="icon-button" aria-label="重設視角" title="重設視角"></button><button id="voice-toggle" class="icon-button" aria-pressed="true"></button></div>
        <div id="bubble" class="bubble" role="log" aria-live="polite" aria-label="MEMO 說的話"><small id="bubble-quote" hidden></small><p id="bubble-text"></p><div id="bubble-sources" class="sources" hidden></div></div>
        <footer class="stage-chat">
          <div id="attachment" class="attachment" hidden><img id="attachment-preview" alt="要給 MEMO 看的圖片" /><button id="attachment-remove" type="button" aria-label="移除圖片" title="移除圖片">×</button></div>
          <form id="chat-form"><label class="sr-only" for="chat-input">想對 MEMO 說什麼？</label><input id="chat-input" placeholder="想對 MEMO 說什麼？可以貼上圖片" maxlength="2000" autocomplete="off" /><input id="image-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/bmp" hidden /><button id="attach" type="button" class="mic" aria-label="上傳圖片給 MEMO 看" title="上傳圖片給 MEMO 看"></button><button id="mic" type="button" class="mic"></button><button id="send-message" type="submit" class="send" aria-label="傳送訊息"></button></form>
        </footer>
      </section>

      <aside class="bar" aria-label="環境監控與參數">
        <header class="bar-head">
          <a class="brand" href="/" aria-label="MEMO 首頁"><svg viewBox="-6 -6 192 222" aria-hidden="true"><rect width="180" height="206" rx="22" fill="#69CDB4" stroke="#1F6B5B" stroke-width="10"/><rect x="18" y="18" width="144" height="104" rx="10" fill="#C4F0DB" stroke="#1F6B5B" stroke-width="8"/><circle cx="66" cy="64" r="10" fill="#12332C"/><circle cx="114" cy="64" r="10" fill="#12332C"/><path d="M68 88 Q90 106 112 88" fill="none" stroke="#12332C" stroke-width="8" stroke-linecap="round"/></svg>MEMO</a>
          <span class="connection"><i id="connection-dot"></i><span id="connection-label">尚未連接後端</span></span>
        </header>

        <div class="panel">
          <section class="monitor" aria-labelledby="monitor-title">
            <h3 id="monitor-title">環境監控<span id="freshness" class="fresh">等待資料</span></h3>
            <div class="readings">
              <div class="metric" data-metric="temperature_c"><span class="metric-name"><i data-icon="thermo"></i>溫度</span><div class="metric-number"><b id="temperature-value">—</b><span>°C</span></div><svg class="sparkline" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true"></svg></div>
              <div class="metric" data-metric="humidity_pct"><span class="metric-name"><i data-icon="drop"></i>濕度</span><div class="metric-number"><b id="humidity-value">—</b><span>%</span></div><svg class="sparkline" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true"></svg></div>
              <div class="metric" data-metric="co2_ppm"><span class="metric-name"><i data-icon="wind"></i>CO₂</span><div class="metric-number"><b id="co2-value">—</b><span>ppm</span></div><svg class="sparkline" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true"></svg></div>
              <div class="metric" data-metric="illuminance_lux"><span class="metric-name"><i data-icon="sun"></i>光照</span><div class="metric-number"><b id="lux-value">—</b><span>lux</span></div><svg class="sparkline" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true"></svg></div>
            </div>
          </section>
          <section class="group">
            <h3>檯燈<span id="lamp-state" class="fresh">白天光</span></h3>
            <div class="seg lamps" role="radiogroup" aria-label="檯燈模式">
              <label><input type="radio" name="lamp" value="off" /><span>關</span></label>
              <label><input type="radio" name="lamp" value="dim" /><span>暗</span></label>
              <label><input type="radio" name="lamp" value="warm" /><span>溫暖</span></label>
              <label><input type="radio" name="lamp" value="day" checked /><span>白天</span></label>
            </div>
          </section>
          <section class="group">
            <h3>人格設定</h3>
            <div class="seg personas" role="radiogroup" aria-label="人格設定">
              <label><input type="radio" name="persona" value="companion" checked /><span>陪伴者</span></label>
              <label><input type="radio" name="persona" value="duty" /><span>值班員</span></label>
              <label><input type="radio" name="persona" value="friend" /><span>損友</span></label>
              <label><input type="radio" name="persona" value="coach" /><span>教練</span></label>
              <label><input type="radio" name="persona" value="custom" /><span>自訂</span></label>
            </div>
            <label class="sr-only" for="persona-text">人格描述</label>
            <textarea id="persona-text" rows="3" maxlength="300" placeholder="描述 MEMO 的角色與說話方式，例如：講話像老派管家，有禮但會碎念。"></textarea>
          </section>
          <section class="group">
            <h3>環境干擾<button id="node-red-toggle" class="state-toggle" type="button" aria-pressed="false" disabled>未連線</button></h3>
            <div class="sliders">
              <label><span>溫度</span><output id="dist-temperature_c-output">0 °C</output><input id="dist-temperature_c" data-offset="temperature_c" data-unit="°C" type="range" min="-5" max="10" step="0.5" value="0" /></label>
              <label><span>濕度</span><output id="dist-humidity_pct-output">0 %</output><input id="dist-humidity_pct" data-offset="humidity_pct" data-unit="%" type="range" min="-25" max="30" step="1" value="0" /></label>
              <label><span>CO₂</span><output id="dist-co2_ppm-output">0 ppm</output><input id="dist-co2_ppm" data-offset="co2_ppm" data-unit="ppm" type="range" min="-200" max="1500" step="50" value="0" /></label>
            </div>
            <div class="actions"><button id="apply-disturbance" class="btn primary" disabled>套用干擾</button><button id="reset-disturbance" class="btn" disabled>恢復正常</button></div>
          </section>
        </div>
      </aside>
    </main>

    <div id="toast" role="status" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
